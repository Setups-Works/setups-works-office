name: Release

# Actions → "Release" → Run workflow → type a version (for example 0.9.2).
# It bumps package.json, commits, tags v<version>, creates ONE GitHub Release, builds the Mac and
# Windows apps into it and publishes the npm package. Installed apps update themselves from the release.
# (Pushing a v* tag by hand also works; the version must match package.json.)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.9.2"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.out.outputs.ref }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "Not a valid version: $v"; exit 1; }
          git rev-parse "v$v" >/dev/null 2>&1 && { echo "Tag v$v already exists"; exit 1; }
          npm version "$v" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Release v$v" || true
          git tag "v$v"
          git push origin "HEAD:${{ github.ref_name }}" "v$v"
      - name: Resolve the tag to build
        id: out
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            v="${{ inputs.version }}"; echo "ref=v${v#v}" >> "$GITHUB_OUTPUT"
          fi
      # One release for the tag, created here, so the Mac and Windows jobs upload into the same one
      # (if each job created its own, the release would be split in two).
      - name: Create the GitHub release once
        run: |
          ref="${{ steps.out.outputs.ref }}"
          gh release view "$ref" >/dev/null 2>&1 || gh release create "$ref" --title "$ref" --generate-notes --verify-tag

  # Windows: the Electron app.
  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional code signing. Without these the apps are built unsigned (see "Signing" in CONTRIBUTING.md).
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm desktop:build
      - name: Build and publish
        shell: bash
        run: |
          # Secrets that aren't set arrive as empty strings, and electron-builder reads an empty
          # CSC_LINK as a path to a certificate. Drop the empty ones.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          args=""
          if [ "${{ matrix.target }}" = "--mac" ]; then
            if [ -z "$CSC_LINK" ]; then
              args="-c.mac.identity=-"   # no certificate: ad-hoc sign so the app still launches
            elif [ -n "$APPLE_ID" ]; then
              args="-c.mac.notarize=true"
            fi
          fi
          pnpm exec electron-builder ${{ matrix.target }} --publish always $args

  # macOS: the native Swift app (macos/), one build per architecture, plus the Sparkle update feeds.
  macos:
    needs: prepare
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build the web UI and server
        run: pnpm build
      - name: Import the signing certificate (if provided)
        run: |
          if [ -z "$MAC_CSC_LINK" ] || [ -z "$MAC_SIGN_IDENTITY" ]; then
            echo "No MAC_CSC_LINK / MAC_SIGN_IDENTITY: the app is ad-hoc signed."
            unset MAC_SIGN_IDENTITY; echo "MAC_SIGN_IDENTITY=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain" login.keychain
      - name: Build the app (Apple silicon and Intel)
        run: |
          for arch in arm64 x64; do
            SKIP_JS_BUILD=1 ARCH=$arch bash macos/build-app.sh
          done
      - name: Create the update feeds (Sparkle)
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set, so the Mac app will not auto-update. See CONTRIBUTING.md."
            exit 0
          fi
          V=$(python3 -c "import json;print([p for p in json.load(open('macos/Package.resolved'))['pins'] if p['identity']=='sparkle'][0]['state']['version'])")
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$V/Sparkle-$V.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" ./bin
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/ed.key"
          TAG="${{ needs.prepare.outputs.ref }}"
          for arch in arm64 x64; do
            mkdir -p "feed-$arch"
            cp macos/dist/*-mac-$arch.zip "feed-$arch/"
            "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file "$RUNNER_TEMP/ed.key" \
              --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$TAG/" \
              -o "appcast-$arch.xml" "feed-$arch"
          done
          rm -f "$RUNNER_TEMP/ed.key"
      - name: Upload to the release
        run: |
          TAG="${{ needs.prepare.outputs.ref }}"
          files=(macos/dist/*.zip macos/dist/*.dmg)
          for f in appcast-*.xml; do [ -f "$f" ] && files+=("$f"); done
          gh release upload "$TAG" "${files[@]}" --clobber

  npm:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN secret not set: skipping the npm publish."; exit 0; fi
          v=$(node -p "require('./package.json').version")
          if npm view "@setupsworks/office@$v" version >/dev/null 2>&1; then echo "@setupsworks/office@$v is already on npm."; exit 0; fi
          pnpm install --frozen-lockfile
          npm publish --access public --provenance
