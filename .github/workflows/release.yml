name: Release desktop app

# Push a tag like v0.8.0 (it must match "version" in package.json) to build the Mac and Windows
# apps and publish them as a GitHub Release. Installed apps update themselves from that release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional code signing. Without these the apps are built unsigned (see "Signing" in CONTRIBUTING.md).
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "refs/tags/v$v" = "$GITHUB_REF" ] || { echo "Tag $GITHUB_REF doesn't match package.json version $v"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm desktop:build
      - name: Build and publish (unsigned)
        if: env.CSC_LINK == '' && env.WIN_CSC_LINK == ''
        run: pnpm exec electron-builder ${{ matrix.target }} --publish always
      - name: Build and publish (signed)
        if: env.CSC_LINK != '' || env.WIN_CSC_LINK != ''
        run: pnpm exec electron-builder ${{ matrix.target }} --publish always -c.mac.notarize=${{ env.APPLE_ID != '' }}
