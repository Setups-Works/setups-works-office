appId: com.setupsworks.office
productName: Setups Works Office
copyright: Copyright © 2026 Setups Works
directories:
  output: release
  buildResources: build
# No asar: the HQ server runs as a child process and loads node_modules (including node-pty's
# native binaries) normally from disk.
asar: false
files:
  - package.json
  - desktop-dist/**
  - dist/**
  - dist-server/**
  - "!**/*.map"
extraMetadata:
  main: desktop-dist/main.cjs
publish:
  provider: github
  owner: Setups-Works
  repo: setups-works-office
  releaseType: release

mac:
  category: public.app-category.developer-tools
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] } # the updater downloads the zip
  files:
    - "!**/node_modules/@lydell/node-pty-win32-*/**"
    - "!**/node_modules/@lydell/node-pty-linux-*/**"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing and notarizing use CSC_LINK / CSC_KEY_PASSWORD and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID from the environment (see .github/workflows/release.yml). Without them the build is unsigned.
  notarize: false
dmg:
  title: Setups Works Office ${version}

win:
  files:
    - "!**/node_modules/@lydell/node-pty-darwin-*/**"
    - "!**/node_modules/@lydell/node-pty-linux-*/**"
  target:
    - { target: nsis, arch: [x64] }
  # Signing uses WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD when set.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
